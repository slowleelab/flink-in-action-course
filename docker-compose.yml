# =====================================================================
# Flink 实战课程 - 一键实验环境
# 用法: docker compose up -d
# 停止: docker compose down          (保留数据)
# 清空: docker compose down -v       (删除所有数据卷)
# =====================================================================
services:

  # -------------------- Flink Standalone 集群 --------------------
  jobmanager:
    image: flink:1.20.1
    container_name: flink-jobmanager
    ports:
      - "8081:8081"          # Web UI
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
        execution.checkpointing.interval: 60s
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints

  taskmanager:
    image: flink:1.20.1
    # 注意：设置了 scale 就不能用 container_name（容器名必须唯一）
    # Compose 会自动生成 flink-taskmanager-1、flink-taskmanager-2 ...
    depends_on:
      - jobmanager
    command: taskmanager
    scale: 2
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend: rocksdb
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints

  # -------------------- Kafka --------------------
  # 课程复用宿主机已运行的 Kafka（localhost:9092），无需重复部署：
  #   docker exec <你的kafka容器> /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
  # 如需课程独立部署，取消下方注释（端口按需调整避免冲突）：
  #
  # kafka:
  #   image: apache/kafka:3.7.0        # bitnami/kafka 版本 tag 已下架，用 Apache 官方镜像
  #   container_name: flink-kafka
  #   ports:
  #     - "9092:9092"
  #   environment:
  #     KAFKA_NODE_ID: 1
  #     KAFKA_PROCESS_ROLES: broker,controller
  #     KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
  #     KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  #     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
  #     KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  #     KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  #     KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  #     # 单节点必须覆盖内部主题副本数（默认 3 起不来）
  #     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  #     KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
  #     KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  #     KAFKA_LOG_DIRS: /var/lib/kafka/data
  #     CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
  #   volumes:
  #     - kafka-data:/var/lib/kafka/data

  # -------------------- MySQL（CDC 源 + 结果表） --------------------
  mysql:
    image: mysql:8.0
    container_name: flink-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=flink123
      - MYSQL_DATABASE=flink_course
    command:
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog_row_image=FULL
      --gtid_mode=ON
      --enforce_gtid_consistency=ON
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql

  # -------------------- Redis（实时去重 / 维表） --------------------
  redis:
    image: redis:7-alpine
    container_name: flink-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

volumes:
  flink-checkpoints:
  flink-savepoints:
  mysql-data:
  redis-data:
